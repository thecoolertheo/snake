<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Night Snake</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&display=swap">
<style>
:root{
  --bg:#0f1512; --bar:#16201b; --tile-a:#1c2a22; --tile-b:#18241d;
  --accent:#5b8cff; --fg:#e6efe9; --muted:#8aa094;
  --font:'Rubik', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);display:flex;align-items:center;justify-content:center;
  padding:16px;box-sizing:border-box;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
button:focus-visible,select:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.wrap{display:flex;flex-direction:column;width:min(100%,560px);border-radius:10px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.bar{display:flex;align-items:center;gap:18px;background:var(--bar);padding:8px 10px 8px 16px;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.bar span{display:flex;align-items:center;gap:8px}
.bar b{display:inline-block}
.bar svg{width:22px;height:22px}
.bar .spacer{flex:1}
.icon-btn{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;border-radius:6px;display:flex}
.icon-btn:hover{color:var(--fg);background:var(--tile-a)}
.icon-btn svg{width:20px;height:20px}
.stage{position:relative}
#c{display:block;width:100%;height:auto;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:flex-start;background:rgba(8,12,10,.6);overflow-y:auto;padding:12px;box-sizing:border-box;touch-action:pan-y}
.menu{margin:auto;width:min(100%,420px);background:var(--bar);border-radius:12px;padding:16px;box-sizing:border-box;display:grid;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.menu h1{margin:0;font-size:18px;text-align:center;color:var(--muted);font-weight:500}
.scores{display:flex;justify-content:center;gap:32px}
.stat{display:flex;align-items:center;gap:8px;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.stat svg{width:30px;height:30px}
#pv{width:100%;max-width:200px;height:auto;justify-self:center;border-radius:6px;display:block}
.field{display:grid;gap:5px;min-width:0}
.field>span{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:24px;height:24px;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.sw[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:2px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
select{width:100%;background:var(--tile-b);color:var(--fg);border:1px solid var(--tile-a);border-radius:6px;padding:6px 6px;font:inherit;font-size:14px;cursor:pointer}
#playBtn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
#playBtn:hover{filter:brightness(1.08)}
.hint{margin:0;text-align:center;color:var(--muted);font-size:12px}
@media (max-width:440px){.grid4{grid-template-columns:1fr 1fr}.stat{font-size:24px}}
</style>

<div class="wrap">
  <div class="bar">
    <span title="Score"><svg viewBox="0 0 24 24"><circle cx="12" cy="14" r="8" fill="#ff5a4e"/><path d="M12 6c0-2 1-3 3-4" stroke="#5fd16a" stroke-width="2" fill="none" stroke-linecap="round"/></svg><b id="score">0</b></span>
    <span title="Best"><svg viewBox="0 0 24 24"><path d="M5 4h14v4a7 7 0 0 1-14 0zM9 18h6v3H9zM11 14h2v4h-2z" fill="#f2c94c"/></svg><b id="best">0</b></span>
    <span class="spacer"></span>
    <button class="icon-btn" id="muteBtn" type="button" aria-label="Sound on"></button>
    <button class="icon-btn" id="menuBtn" type="button" aria-label="Pause and open menu"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
  </div>
  <div class="stage">
    <canvas id="c" width="680" height="600"></canvas>
    <div class="overlay" id="overlay">
      <div class="menu">
        <h1 id="ovTitle">Snake</h1>
        <div class="scores">
          <div class="stat" title="Score"><svg viewBox="0 0 24 24"><circle cx="12" cy="14" r="8" fill="#ff5a4e"/><path d="M12 6c0-2 1-3 3-4" stroke="#5fd16a" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span id="mScore">0</span></div>
          <div class="stat" title="Best"><svg viewBox="0 0 24 24"><path d="M5 4h14v4a7 7 0 0 1-14 0zM9 18h6v3H9zM11 14h2v4h-2z" fill="#f2c94c"/></svg><span id="mBest">0</span></div>
        </div>
        <canvas id="pv" width="280" height="120"></canvas>
        <div class="field"><span>Color</span><div class="swatches" id="optColor"></div></div>
        <div class="grid4">
          <label class="field"><span>Pattern</span><select id="optPattern"></select></label>
          <label class="field"><span>Eyes</span><select id="optEyes"></select></label>
          <label class="field"><span>Tail</span><select id="optShape"></select></label>
          <label class="field"><span>Speed</span><select id="optSpeed"></select></label>
        </div>
        <button id="playBtn" type="button">Play</button>
        <p class="hint">Arrow keys or WASD · swipe on touch · Esc to pause</p>
      </div>
    </div>
  </div>
</div>

<script>
(()=>{
// ---------- config ----------
const COLS=17, ROWS=15, CELL=40, STEP=4;
const TILE_A='#1c2a22', TILE_B='#18241d', GREY=[86,96,90];
const COLORS=[['Blue','#5b8cff'],['Green','#4cc35b'],['Purple','#9b6bff'],['Pink','#ff6fb1'],
              ['Orange','#ff9838'],['Yellow','#f2cd3f'],['Teal','#27c2b0'],['Ghost','#dfe6e2']];
const PATTERNS=['Solid','Stripes','Fade','Rainbow'];
const EYES=['Classic','Big','Sleepy','Shades'];
const SHAPES=['Round','Tapered'];
const SPEEDS=['Slow','Normal','Fast'], SPEED_MS=[190,150,110];

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let skin={color:0,pattern:0,eyes:0,shape:0,speed:1};
try{const s=JSON.parse(store.get('snake-skin')); if(s) skin={...skin,...s};}catch(e){}
let best=+store.get('snake-best')||0;
let muted=store.get('snake-muted')==='1';

// ---------- elements ----------
const $=id=>document.getElementById(id);
const cv=$('c'), ctx=cv.getContext('2d'), pv=$('pv'), pctx=pv.getContext('2d');
const scoreEl=$('score'), bestEl=$('best'), overlay=$('overlay'), ovTitle=$('ovTitle');
const mScore=$('mScore'), mBest=$('mBest'), playBtn=$('playBtn'), muteBtn=$('muteBtn'), menuBtn=$('menuBtn');
bestEl.textContent=best;

// ---------- sound (synthesised, no files needed) ----------
let actx=null;
function audio(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(actx&&actx.state==='suspended') actx.resume();
  return actx;
}
function tone(freq,dur,{type='sine',vol=.2,slide=0,delay=0}={}){
  if(muted) return; const a=audio(); if(!a) return;
  const t0=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t0+dur);
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.01); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+dur+.03);
}
const SFX={
  eat(){tone(520,.08,{type:'square',vol:.06,slide:400});tone(900,.14,{vol:.14,delay:.05,slide:350});},
  turn(){tone(320,.03,{type:'triangle',vol:.035});},
  start(){tone(440,.08,{type:'triangle',vol:.1});tone(660,.12,{type:'triangle',vol:.1,delay:.08});},
  die(){tone(240,.16,{type:'square',vol:.08,slide:-120});tone(170,.4,{type:'sawtooth',vol:.05,delay:.12,slide:-110});},
  click(){tone(620,.04,{type:'triangle',vol:.05});}
};
const ICON_ON='<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const ICON_OFF='<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
function renderMute(){muteBtn.innerHTML=muted?ICON_OFF:ICON_ON;muteBtn.setAttribute('aria-label',muted?'Sound off':'Sound on');}
renderMute();

// ---------- math helpers ----------
const hexRgb=h=>{const n=parseInt(h.slice(1),16);return[n>>16,(n>>8)&255,n&255];};
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const rgb=a=>`rgb(${a[0]},${a[1]},${a[2]})`;
function hsl(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
  return [0,8,4].map(n=>Math.round((l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1)))*255));}
const ease=t=>t*t*(3-2*t);
const ang=d=>Math.atan2(d.y,d.x);
const sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y});
function lerpAng(a,b,t){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return a+d*t;}

// Smooth path from tail to head with rounded corners.
// m = distance from the tail along the grid path, so patterns stay stuck to the body.
function buildPath(cells,prevTail,p,cell){
  const c=q=>({x:q.x*cell+cell/2,y:q.y*cell+cell/2});
  const L=(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});
  const n=cells.length;
  const raw=[L(c(prevTail),c(cells[n-1]),p)];
  for(let i=n-1;i>=1;i--) raw.push(c(cells[i]));
  raw.push(L(c(cells[1]),c(cells[0]),p));
  const v=[];
  for(const q of raw){const l=v[v.length-1]; if(!l||Math.abs(l.x-q.x)+Math.abs(l.y-q.y)>.01) v.push(q);}
  const out=[{x:v[0].x,y:v[0].y,m:0}];
  let cur={x:v[0].x,y:v[0].y}, m=0;
  const line=(tx,ty)=>{
    const len=Math.hypot(tx-cur.x,ty-cur.y); if(len<.01) return;
    const steps=Math.ceil(len/STEP);
    for(let j=1;j<=steps;j++) out.push({x:cur.x+(tx-cur.x)*j/steps,y:cur.y+(ty-cur.y)*j/steps,m:m+len*j/steps});
    m+=len; cur={x:tx,y:ty};
  };
  for(let i=1;i<v.length;i++){
    const A=v[i-1], V=v[i], B=v[i+1];
    if(B){
      const ux=Math.sign(V.x-A.x), uy=Math.sign(V.y-A.y), wx=Math.sign(B.x-V.x), wy=Math.sign(B.y-V.y);
      const r=Math.min(cell/2,Math.hypot(V.x-A.x,V.y-A.y),Math.hypot(B.x-V.x,B.y-V.y));
      if((ux!==wx||uy!==wy)&&r>.5){
        const sx=V.x-ux*r, sy=V.y-uy*r; line(sx,sy);
        const cx=sx+wx*r, cy=sy+wy*r, m0=m, steps=Math.max(2,Math.ceil(Math.PI/2*r/STEP));
        for(let j=1;j<=steps;j++){
          const f=Math.PI/2*j/steps;
          out.push({x:cx+r*(-wx*Math.cos(f)+ux*Math.sin(f)),y:cy+r*(-wy*Math.cos(f)+uy*Math.sin(f)),m:m0+2*r*j/steps});
        }
        m=m0+2*r; cur={x:V.x+wx*r,y:V.y+wy*r};
        continue;
      }
    }
    line(V.x,V.y);
  }
  return out;
}

// Strokes the path in runs of identical colour/width so it stays fast.
function strokeRuns(g,pts,styleAt,widthAt,dy){
  g.lineCap='round'; g.lineJoin='round';
  let i=1;
  while(i<pts.length){
    const st=styleAt(pts[i].m), w=widthAt(pts[i].m);
    g.strokeStyle=st; g.lineWidth=w; g.beginPath(); g.moveTo(pts[i-1].x,pts[i-1].y+dy);
    while(i<pts.length&&styleAt(pts[i].m)===st&&widthAt(pts[i].m)===w){g.lineTo(pts[i].x,pts[i].y+dy);i++;}
    g.stroke();
  }
}

// fx: {dead, flash 0..1, grey 0..1, bulges:[distance from head], mouth 0..1}
function drawSnake(g,cells,prevTail,p,cell,headAng,fx={}){
  const pts=buildPath(cells,prevTail,p,cell);
  const M=pts[pts.length-1].m||1, k=cell/40, W=cell*.72;
  const base=hexRgb(COLORS[skin.color][1]);
  const dark=mix(base,[0,0,0],.3), shadow=mix(base,[0,0,0],.5), fadeTo=mix(base,[15,22,18],.6);
  const pat=PATTERNS[skin.pattern];
  const hue=m=>Math.round(m/cell*28)%360;
  const sig2=2*(cell*.45)**2;
  const widthAt=m=>{
    let w=SHAPES[skin.shape]==='Tapered'?W*(.4+.6*ease(Math.min(1,m/(cell*3)))):W;
    if(fx.bulges) for(const d of fx.bulges){const x=(M-m)-d; w*=1+.32*Math.exp(-x*x/sig2);}
    return Math.round(w*2)/2;
  };
  const effects=(c,m,withFlash)=>{
    if(fx.grey){const f=(M-m)/M, a=Math.max(0,Math.min(1,(fx.grey*1.4-f)/.4)); if(a>0) c=mix(c,GREY,Math.round(a*16)/16*.85);}
    if(withFlash&&fx.flash) c=mix(c,[255,255,255],fx.flash);
    return rgb(c);
  };
  const raw=m=>{
    if(pat==='Stripes') return ((m%cell)+cell)%cell<cell*.4?dark:base;
    if(pat==='Fade') return mix(base,fadeTo,Math.round((1-m/M)*32)/32);
    if(pat==='Rainbow') return hsl(hue(m),85,62);
    return base;
  };
  const rawShadow=m=>pat==='Rainbow'?hsl(hue(m),60,32):shadow;
  strokeRuns(g,pts,m=>effects(rawShadow(m),m,false),widthAt,3*k);
  strokeRuns(g,pts,m=>effects(raw(m),m,true),widthAt,0);
  const h=pts[pts.length-1], hc=effects(raw(M),M,true);
  g.fillStyle=hc; g.beginPath(); g.arc(h.x,h.y,widthAt(M)/2*1.06,0,Math.PI*2); g.fill();
  drawFace(g,h.x,h.y,headAng,k,fx,hc);
}

function drawFace(g,x,y,a,k,fx,bodyCol){
  const style=EYES[skin.eyes], ink='#0f1512', dead=!!fx.dead;
  const dot=(cx,cy,r)=>{g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.fill();};
  g.save(); g.translate(x,y); g.rotate(a);
  const o=fx.mouth||0;
  if(o>.03&&!dead){
    g.fillStyle='#3b1016'; g.beginPath(); g.ellipse(11*k,0,4.5*k*o+.5,8*k*o,0,0,Math.PI*2); g.fill();
    g.fillStyle='#ff6b7a'; g.beginPath(); g.ellipse(12.5*k,0,2*k*o,3.4*k*o,0,0,Math.PI*2); g.fill();
  }
  if(style==='Shades'&&!dead){
    g.fillStyle='#111518';
    for(const s of [-1,1]){g.beginPath();g.ellipse(5*k,s*8*k,5*k,6.5*k,0,0,Math.PI*2);g.fill();}
    g.fillRect(3.5*k,-8*k,2.5*k,16*k);
    g.fillStyle='rgba(255,255,255,.55)';
    for(const s of [-1,1]) g.fillRect(6.5*k,s*8*k-4*k,1.6*k,3*k);
  } else {
    for(const s of [-1,1]){
      const big=style==='Big', ex=(big?3:4)*k, ey=s*(big?9.5:8)*k, r=(big?7.5:5.5)*k;
      g.fillStyle='#fff'; dot(ex,ey,r);
      if(dead){
        g.strokeStyle=ink; g.lineWidth=1.8*k; g.lineCap='round'; const q=r*.5;
        g.beginPath(); g.moveTo(ex-q,ey-q); g.lineTo(ex+q,ey+q); g.moveTo(ex+q,ey-q); g.lineTo(ex-q,ey+q); g.stroke();
        continue;
      }
      g.fillStyle=ink; dot(ex+(big?2.6:2)*k,ey,(big?3.8:2.8)*k);
      if(big){g.fillStyle='#fff'; dot(ex+3.4*k,ey-1.4*k,1.2*k);}
      if(style==='Sleepy'){
        g.fillStyle=bodyCol; g.beginPath(); g.arc(ex,ey,r+.8*k,Math.PI/2,Math.PI*1.5); g.fill();
        g.strokeStyle=ink; g.lineWidth=1.5*k; g.beginPath(); g.moveTo(ex,ey-r); g.lineTo(ex,ey+r); g.stroke();
      }
    }
  }
  g.restore();
}

function drawTiles(g,cols,rows,cell){
  for(let x=0;x<cols;x++)for(let y=0;y<rows;y++){g.fillStyle=(x+y)%2?TILE_B:TILE_A;g.fillRect(x*cell,y*cell,cell,cell);}
}

// ---------- eat effects ----------
let parts=[], rings=[];
function burst(cx,cy){
  const now=performance.now();
  for(let i=0;i<14;i++){
    const a=Math.random()*Math.PI*2, sp=100+Math.random()*180;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:3+Math.random()*3.5,
      c:Math.random()<.65?'#ff5a4e':(Math.random()<.5?'#5fd16a':'#ffd5cf'),born:now,life:380+Math.random()*220});
  }
  rings.push({x:cx,y:cy,born:now});
}
function drawFx(t,dt){
  const s=dt/1000, damp=Math.exp(-5*s);
  parts=parts.filter(p=>t-p.born<p.life);
  for(const p of parts){
    p.x+=p.vx*s; p.y+=p.vy*s; p.vx*=damp; p.vy*=damp;
    const f=1-(t-p.born)/p.life;
    ctx.globalAlpha=f; ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*f,0,Math.PI*2); ctx.fill();
  }
  rings=rings.filter(r=>t-r.born<380);
  for(const r of rings){
    const f=(t-r.born)/380;
    ctx.globalAlpha=1-f; ctx.strokeStyle='#ffffff'; ctx.lineWidth=3*(1-f)+.5;
    ctx.beginPath(); ctx.arc(r.x,r.y,CELL*(.3+.9*ease(f)),0,Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function bump(el){try{el.animate([{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:240,easing:'ease-out'});}catch(e){}}

// ---------- game state ----------
let snake,prevTail,dir,prevDir,queue,apple,appleT=0,score=0,grow=0,state='ready';
let acc=0,last=0,deathT=0,gameTime=0,eats=[],undo=null,mouth=0;

function reset(){
  const y=Math.floor(ROWS/2);
  snake=[{x:4,y},{x:3,y},{x:2,y}];
  prevTail={...snake[2]};
  dir={x:1,y:0}; prevDir={...dir}; queue=[]; score=0; grow=0; scoreEl.textContent=0;
  eats=[]; undo=null; mouth=0; deathT=0; parts=[]; rings=[]; acc=0;
  placeApple();
}
function placeApple(){
  const free=[];
  for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++) if(!snake.some(s=>s.x===x&&s.y===y)) free.push({x,y});
  apple=free.length?free[Math.random()*free.length|0]:null;
  appleT=performance.now();
}
function showMenu(title,btn){
  if(score>best){best=score;store.set('snake-best',best);bestEl.textContent=best;}
  ovTitle.textContent=title; mScore.textContent=score; mBest.textContent=best; playBtn.textContent=btn;
  overlay.hidden=false; playBtn.focus({preventScroll:true});
}
function start(){
  if(state==='play') return;
  if(state==='over'&&overlay.hidden) return;   // still playing the death animation
  if(state==='over') reset();
  if(state!=='paused') SFX.start();
  state='play'; overlay.hidden=true;
  if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
}
function pause(){ if(state==='play'){state='paused';showMenu('Paused','Resume');} }

function turn(nx,ny){
  if(state==='over'&&overlay.hidden) return;
  if(state!=='play'){
    const fresh=state!=='paused';
    start();
    if(fresh){ if(nx*dir.x+ny*dir.y===0) queue.push({x:nx,y:ny}); step(); acc=0; SFX.turn(); return; }
  }
  const ms=SPEED_MS[skin.speed];
  // Instant turn: if the head only just left its cell, redo this move in the new direction.
  if(queue.length===0&&undo&&acc<ms*.4&&dir.x===undo.dir.x&&dir.y===undo.dir.y&&nx*dir.x+ny*dir.y===0){
    snake=undo.snake; prevTail=undo.prevTail; dir=undo.dir; prevDir=undo.prevDir; grow=undo.grow; undo=null;
    queue.push({x:nx,y:ny}); step(); SFX.turn(); return;
  }
  const ref=queue.length?queue[queue.length-1]:dir;
  if(nx*ref.x+ny*ref.y!==0) return;   // same direction or reverse
  if(queue.length<3){queue.push({x:nx,y:ny}); SFX.turn();}
}
function step(){
  const nd=queue.length?queue.shift():dir;
  const h={x:snake[0].x+nd.x,y:snake[0].y+nd.y};
  const willEat=apple&&h.x===apple.x&&h.y===apple.y;
  const body=grow>0||willEat?snake:snake.slice(0,-1);
  if(h.x<0||h.y<0||h.x>=COLS||h.y>=ROWS||body.some(s=>s.x===h.x&&s.y===h.y)){die();return;}
  undo={snake:snake.map(s=>({...s})),prevTail:{...prevTail},dir:{...dir},prevDir:{...prevDir},grow};
  prevDir=dir; dir=nd;
  prevTail={...snake[snake.length-1]};
  snake.unshift(h);
  if(willEat){
    score++; scoreEl.textContent=score; bump(scoreEl); grow++; undo=null;
    burst(apple.x*CELL+CELL/2,apple.y*CELL+CELL/2); eats.push(gameTime); mouth=0; SFX.eat();
    placeApple();
  }
  if(grow>0) grow--; else snake.pop();
  if(!apple){state='over';showMenu('You win!','Play again');}
}
function die(){
  state='over'; deathT=performance.now(); queue=[]; undo=null; prevDir=dir; SFX.die();
  setTimeout(()=>{ if(state==='over') showMenu('Game over','Play again'); },1100);
}

function drawApple(t){
  if(!apple) return;
  const s=Math.min(1,(t-appleT)/260), pop=s<1?1+Math.sin(s*Math.PI)*.25-(1-s)*.6:1;
  const cx=apple.x*CELL+CELL/2, cy=apple.y*CELL+CELL/2+2, r=CELL*.33*pop*(1+Math.sin(t/220)*.04);
  if(r<=0) return;
  ctx.fillStyle='#ff5a4e'; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.28)'; ctx.beginPath(); ctx.arc(cx-r*.35,cy-r*.35,r*.25,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#5fd16a'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(cx,cy-r*.8); ctx.quadraticCurveTo(cx+2,cy-r*1.4,cx+7,cy-r*1.5); ctx.stroke();
}

// ---------- menu preview (loops around a little track) ----------
const PV=[]; for(let x=0;x<7;x++)PV.push({x,y:0}); PV.push({x:6,y:1}); for(let x=6;x>=0;x--)PV.push({x,y:2}); PV.push({x:0,y:1});
function drawPreview(t){
  const st=t/SPEED_MS[skin.speed], hi=Math.floor(st), p=st-hi, L=PV.length, at=i=>PV[((i%L)+L)%L];
  const cells=[]; for(let i=0;i<6;i++) cells.push(at(hi-i));
  drawTiles(pctx,7,3,40);
  const a=lerpAng(ang(sub(cells[1],cells[2])),ang(sub(cells[0],cells[1])),ease(Math.min(1,p/.7)));
  drawSnake(pctx,cells,at(hi-6),p,40,a);
}

// ---------- main loop ----------
function frame(t){
  const dt=Math.min(50,t-last); last=t;
  const ms=SPEED_MS[skin.speed];
  if(state==='play'){acc+=dt; gameTime+=dt; while(acc>=ms&&state==='play'){acc-=ms;step();}}
  const p=state==='play'?Math.min(acc/ms,1):1;

  // mouth opens as the head approaches an apple
  let target=0;
  if(apple&&state==='play'){
    const hx=snake[1].x+(snake[0].x-snake[1].x)*p, hy=snake[1].y+(snake[0].y-snake[1].y)*p;
    const ax=apple.x-hx, ay=apple.y-hy, ahead=ax*dir.x+ay*dir.y, side=Math.abs(ax*dir.y-ay*dir.x);
    if(ahead>0&&ahead<2.2&&side<.6) target=Math.min(1,(2.2-ahead)/1.6);
  }
  mouth+=(target-mouth)*Math.min(1,dt/60);

  // death: shake, flash, then the body greys out from head to tail
  const dead=state==='over'&&!!apple&&deathT>0, e=t-deathT;
  const flash=dead&&e<600&&((e/100|0)%2===0)?.75:0;
  const grey=dead&&e>600?Math.min(1,(e-600)/450):0;
  const shake=dead&&e<350?(1-e/350)*7:0;

  ctx.save();
  ctx.fillStyle=TILE_B; ctx.fillRect(0,0,cv.width,cv.height);
  if(shake) ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake);
  drawTiles(ctx,COLS,ROWS,CELL); drawApple(t);
  eats=eats.filter(g=>(gameTime-g)/ms*CELL*1.6<snake.length*CELL+CELL);
  const bulges=eats.map(g=>(gameTime-g)/ms*CELL*1.6);
  const a=lerpAng(ang(prevDir),ang(dir),ease(Math.min(1,p/.7)));
  drawSnake(ctx,snake,prevTail,p,CELL,a,{dead,flash,grey,bulges,mouth});
  drawFx(t,dt);
  ctx.restore();

  if(!overlay.hidden) drawPreview(t);
  requestAnimationFrame(frame);
}

// ---------- menu controls ----------
function saveSkin(){store.set('snake-skin',JSON.stringify(skin));}
const colorBox=$('optColor');
COLORS.forEach(([name,hex],i)=>{
  const b=document.createElement('button'); b.type='button'; b.className='sw';
  b.style.background=hex; b.title=name; b.setAttribute('aria-label',name); b.setAttribute('aria-pressed',skin.color===i);
  b.addEventListener('click',()=>{skin.color=i;saveSkin();SFX.click();[...colorBox.children].forEach((c,j)=>c.setAttribute('aria-pressed',j===i));});
  colorBox.appendChild(b);
});
function fillSelect(id,key,items){
  const sel=$(id);
  items.forEach((n,i)=>sel.add(new Option(n,i)));
  sel.value=skin[key];
  sel.addEventListener('change',()=>{skin[key]=+sel.value;saveSkin();SFX.click();});
}
fillSelect('optPattern','pattern',PATTERNS);
fillSelect('optEyes','eyes',EYES);
fillSelect('optShape','shape',SHAPES);
fillSelect('optSpeed','speed',SPEEDS);

playBtn.addEventListener('click',()=>{audio();start();});
menuBtn.addEventListener('click',()=>{audio();pause();});
muteBtn.addEventListener('click',()=>{muted=!muted;store.set('snake-muted',muted?'1':'0');renderMute();if(!muted)SFX.click();});

// ---------- input ----------
const KEYS={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],
            ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};
addEventListener('keydown',e=>{
  audio();
  if(e.target.tagName==='SELECT') return;
  const k=KEYS[e.key];
  if(k){e.preventDefault(); if(!e.repeat) turn(k[0],k[1]); return;}
  if(e.key==='Escape'||e.key==='p'||e.key==='P'){ if(state==='play') pause(); else if(state==='paused') start(); return; }
  if((e.key===' '||e.key==='Enter')&&!overlay.hidden&&!(e.target instanceof HTMLButtonElement)){e.preventDefault();start();}
});
let ts=null;
cv.addEventListener('touchstart',e=>{audio();ts=e.touches[0];},{passive:true});
cv.addEventListener('touchmove',e=>{
  if(!ts||!overlay.hidden) return;
  const t=e.touches[0], dx=t.clientX-ts.clientX, dy=t.clientY-ts.clientY;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20) return;
  Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy));
  ts=t;
},{passive:true});

reset();
showMenu('Snake','Play');
requestAnimationFrame(t=>{last=t;frame(t);});
})();
</script>

</body></html>
