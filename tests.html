<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake – rule tests</title>
<style>
  body { background: #0f1512; color: #e6efe9; font: 15px/1.5 system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; }
  h1 { font-size: 20px; } .sum { font-size: 18px; font-weight: 700; margin: 12px 0 16px; }
  li { list-style: none; padding: 4px 0; } .ok::before { content: '✔ '; color: #4cc35b; } .bad::before { content: '✘ '; color: #ff5a4e; }
  .bad { color: #ffb3ad; } small { display: block; color: #8aa094; margin-left: 20px; }
</style>
</head>
<body>
<h1>Snake rule tests</h1>
<div class="sum" id="sum"></div>
<ul id="list"></ul>
<script src="js/util.js"></script>
<script src="js/game.js"></script>
<script src="js/sync-core.js"></script>
<script src="tests.js"></script>
<script>
  const res = Snake.testResults, list = document.getElementById('list');
  let fail = 0;
  for (const r of res) {
    const li = document.createElement('li');
    li.className = r.ok ? 'ok' : 'bad'; li.textContent = r.name;
    if (!r.ok) { fail++; const s = document.createElement('small'); s.textContent = r.msg; li.appendChild(s); }
    list.appendChild(li);
  }
  const sum = document.getElementById('sum');
  sum.textContent = fail ? `${fail} of ${res.length} failed` : `All ${res.length} passed`;
  sum.style.color = fail ? '#ff5a4e' : '#4cc35b';
  document.title = (fail ? 'FAIL' : 'PASS') + ' – Snake tests';
</script>
</body>
</html>
